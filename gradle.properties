# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.nonTransitiveRClass=true
android.r8.maxWorkers=1
android.r8.optimizedResourceShrinking=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
duckdetector.android.buildTools=37.0.0
duckdetector.android.cmake=4.1.2
duckdetector.android.compileSdk=37
duckdetector.android.compileSdkMinor=0
duckdetector.android.minSdk=29
duckdetector.android.ndk=30.0.16138531
duckdetector.android.targetSdk=37
# The standard library every library module declares. The modules also compile with its language and
# API version, 2.3, so a host on the Kotlin that AGP 9 bundles, 2.2, can compile against the SDK AAR:
# a Kotlin compiler reads metadata one language version ahead.
duckdetector.kotlin.sdkStdlib=2.3.21
android.suppressUnsupportedCompileSdk=37.0
# Dependency Analysis 3.19.2 is tested up to AGP 9.3.1. Its analysis of this AGP 9.4.1 build was
# verified when buildHealth was introduced, so its version notice goes to the debug log.
# Revisit this when either version changes.
dependency.analysis.compatibility=debug

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
